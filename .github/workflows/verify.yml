name: Verify
on:
  pull_request:
  push:
    branches: [main, codex/agent-collaboration-setup]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ""
      XAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:town
      - run: npm test
      - name: Local authority and recovery experiments
        run: node --test experiments/server-authority/authority.test.mjs experiments/server-adapter/adapter.test.mjs
      - run: npm run diagnose:town
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/quality-browser.mjs
      - name: Read-only stamp appearance browser checks
        run: |
          npm run test:browser:stamps
          GAME_STAMP_QA_WALLET=leather GAME_STAMP_QA_OUT=artifacts/stamp-identity-browser/leather npm run test:browser:stamps
      - name: Delayed AI and replay browser checks
        run: |
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js dev --host 127.0.0.1 --port 8094 --force > /tmp/game-ai-preview.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 120; attempt++) {
            try {
              if ((await fetch("http://127.0.0.1:8094/", { signal: AbortSignal.timeout(1000) })).ok) {
                ready = true;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (!ready) throw new Error("AI test preview did not start");
          JS
          node scripts/quality-ai-browser.mjs
          DISCUSSION_QA_URL=http://127.0.0.1:8094/ npm run test:browser:meetings
          GAME_SKIN_QA_URL=http://127.0.0.1:8094/ GAME_SKIN_QA_OUT=artifacts/ui-interfaces node scripts/skin-browser.mjs
      - name: Accessibility checks
        run: |
          node scripts/with-app-env.mjs node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 8198 --strictPort > /tmp/game-a11y-preview.log 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 120; attempt++) {
            try {
              if ((await fetch("http://127.0.0.1:8198/", { signal: AbortSignal.timeout(1000) })).ok) {
                ready = true;
                break;
              }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 250));
          }
          if (!ready) throw new Error("Accessibility preview did not start");
          JS
          GAME_A11Y_QA_URL=http://127.0.0.1:8198/ npm run test:browser:a11y
      - name: Authenticated private agent-wallet browser checks
        env:
          VITE_AUTH_ENABLED: "true"
        run: |
          npm run build
          npm run test:browser:agent-wallets
          GAME_AGENT_QA_WALLET=leather GAME_AGENT_QA_OUT=artifacts/agent-wallet-browser/leather npm run test:browser:agent-wallets
      - name: Build Cloudflare target without migrations
        run: npm run build:cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-quality
          path: |
            artifacts/quality-browser
            artifacts/quality-ai-browser
            artifacts/discussion-ui
            artifacts/stamp-identity-browser
            artifacts/agent-wallet-browser
            artifacts/accessibility-browser
            artifacts/ui-interfaces
          if-no-files-found: ignore
